<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>政务写作与公共传播 · Public Communication</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
<script src="../entrances.js?v=1" defer></script><script src="../bridge.js" defer></script>
</head>
<body>
  <main class="exhibition">

    <section class="introduction" aria-labelledby="page-title">
      <h1 id="page-title" class="entrance" style="--delay:90ms"><span class="ink">Public</span><br><span class="ink">Communication<span class="period">.</span></span></h1>
    </section>

    <section class="works" aria-label="三类写作作品">
      <article class="work media-work entrance" style="--delay:340ms">
        <div class="work-heading"><span class="number">01</span><h2 class="ink">融媒文章</h2></div>
        <p class="category">新闻表达 / 信息组织</p>
        <div class="media-lead"><span class="large-word ink">多篇</span><span class="media-note">文章获市级<br>融媒体收录</span></div>
        <button class="evidence media-evidence" data-image="media" aria-label="放大查看市级融媒体收录截图">
          <img src="assets/media-2.png" alt="市级融媒体收录截图：湖北泓博乘AI服务器市场东风，订单排满2026年" width="791" height="139">
          
        </button>
        <p class="caption">市级融媒体收录 · 部分展示</p>
      </article>

      <article class="work speech-work entrance" style="--delay:430ms">
        <div class="work-heading"><span class="number">02</span><h2 class="ink">领导讲话稿</h2></div>
        <p class="category">议题提炼 / 正式表达</p>
        <button class="evidence document-evidence" data-image="speech" aria-label="放大查看市级领导讲话稿">
          <img src="assets/speech.png" alt="政企同心稳增长，供需联动促双赢——在全市工业产品供需对接会上的讲话，署名市委副书记、市长" width="840" height="640">
          
        </button>
        <p class="caption">全市工业产品供需对接会</p>
        <p class="work-description ink">围绕会议主题组织信息，<br>兼顾表达分寸与现场讲话节奏。</p>
      </article>

      <article class="work video-work entrance" style="--delay:520ms">
        <div class="work-heading"><span class="number">03</span><h2 class="ink">活动视频文案</h2></div>
        <p class="category">主题叙事 / 视听节奏</p>
        <button class="evidence document-evidence" data-image="video" aria-label="放大查看市级活动开场视频文案">
          <img src="assets/video.png" alt="2026年荆楚科普大讲堂之走进鄂州暨莲花山AI科普讲座开讲活动开场视频文案" width="823" height="655">
          
        </button>
        <p class="caption">市级大型活动 · 开场视频</p>
        <p class="work-description ink">将活动主题转化为视听语言，<br>以简洁文案铺陈开场氛围。</p>
      </article>
    </section>
  </main>

  <dialog class="viewer" aria-labelledby="viewer-title">
    <div class="viewer-bar"><p id="viewer-title"></p><button class="close" aria-label="关闭图片">×</button></div>
    <div class="viewer-stage"><img id="viewer-image" alt=""></div>
    <div class="viewer-bottom"><button class="previous" aria-label="上一张图片">←</button><span id="viewer-count"></span><button class="next" aria-label="下一张图片">→</button></div>
  </dialog>
<script src="../../scroll-bridge.js"></script></body>
</html>
