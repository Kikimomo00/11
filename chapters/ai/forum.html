      const postListEl = document.getElementById('focixPostList');
      const detailViewEl = document.getElementById('focixDetailView');
      const backBtnEl = document.getElementById('focixBackBtn');
      const detailTitleEl = document.getElementById('focixDetailTitle');
      const detailAuthorEl = document.getElementById('focixDetailAuthor');
      const detailTimeEl = document.getElementById('focixDetailTime');
      const detailContentEl = document.getElementById('focixDetailContent');
      const commentListEl = document.getElementById('focixCommentList');
      const countTagEl = document.getElementById('focixCommentCountTag');

      function renderList() {
        postListEl.innerHTML = '';
        postsData.forEach(post => {
          const item = document.createElement('div');
          item.className = 'focix_post_item';
          item.innerHTML = `
          <div class="focix_post_title">${post.title}</div>
          <div class="focix_post_meta">
          <div class="focix_post_author">
          <div class="focix_post_avatar_mini"></div>
          <span>${post.author}</span>
          <span>•</span>
          <span>${post.time}</span>
          </div>
          <div class="focix_post_stats">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
          <span>${post.repliesCount}</span>
          </div>
          </div>
          `;
          item.addEventListener('click', () => openDetail(post));
          postListEl.appendChild(item);
        });
      }

      function openDetail(post) {
        detailTitleEl.textContent = post.title;
        detailAuthorEl.textContent = post.author;
        detailTimeEl.textContent = post.time;
        detailContentEl.textContent = post.content;
        countTagEl.textContent = `共 ${post.comments.length} 条评论`;

        commentListEl.innerHTML = '';
        post.comments.forEach(c => {
          const cItem = document.createElement('div');
          cItem.className = 'focix_comment_item';
          cItem.innerHTML = `
          <div class="focix_comment_avatar"></div>
          <div class="focix_comment_main">
          <div class="focix_comment_top">
          <div class="focix_comment_user">${c.user}</div>
          <div class="focix_comment_floor">${c.floor}</div>
          </div>
          <div class="focix_comment_text">${c.text}</div>
          </div>
          `;
          commentListEl.appendChild(cItem);
        });

        postListEl.style.display = 'none';
        detailViewEl.classList.add('active');
        detailViewEl.scrollTop = 0;
      }

      backBtnEl.addEventListener('click', () => {
        detailViewEl.classList.remove('active');
        postListEl.style.display = 'flex';
      });

      renderList();
    })();
  </script>
