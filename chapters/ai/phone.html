<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>夜航 · 通讯组件</title></head><body>
<div class="portfolio-phone-wrapper luxury-phone-wrapper">
<style>
  /*  Portfolio的神级CSS v6.13 (丝滑加载版)  */
  .portfolio-phone-wrapper {

  }
  .portfolio-phone-wrapper * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
  .flex-c { display: flex; justify-content: center; align-items: center; }

  .req-top { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; border-bottom: 1px solid var(--border-l); padding-bottom: 8px; }

  .chat-footer { background: var(--bg-dark); padding: 8px 12px 10px; gap: 8px; border-top: 1px solid var(--bg-panel); z-index: 2; }
  .quick-bar { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; } .quick-bar::-webkit-scrollbar { display: none; }

  .input-row { display: flex; align-items: center; gap: 8px; width: 100%; } .action-icon { width: 22px; height: 22px; cursor: pointer; color: var(--border-l); flex-shrink: 0; }

  .chat-input.blocked { background: #3a1a1a; color: #f44; border-color: #522; } .inner-voice-icon { position: absolute; right: 10px; width: 16px; height: 16px; color: #888; cursor: pointer; }

  .drawer-menu { height: 0; overflow-y: auto; background: var(--bg-dark); transition: height .2s, padding .2s; scrollbar-width: none; } .drawer-menu::-webkit-scrollbar { display: none; }

  .emoji-menu { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; justify-items: center; } .emoji-menu.show { height: 220px; padding: 15px; }

  .switch-item { background: var(--bg-panel); border: 1px solid var(--border-d); border-radius: 12px; padding: 10px 15px; color: var(--text-light); font-size: .8em; cursor: pointer; display: flex; align-items: center; gap: 10px; transition: background .2s; }

  /*  朋友圈页面 */

  .moments-header { position: absolute; top: 0; left: 0; width: 100%; padding: 28px 15px 10px; background: rgba(255,255,255,0.85); backdrop-filter: blur(10px); color: var(--text-dark); font-weight: bold; font-size: .95em; z-index: 30; border-bottom: 1px solid rgba(0,0,0,0.05); display: flex; justify-content: space-between; align-items: center; border-radius: 28px 28px 0 0; }
  .moments-back-wrap { cursor: pointer; display: flex; align-items: center; }
  .moments-top-refresh-btn { width: 20px; height: 20px; cursor: pointer; color: var(--text-dark); transition: color .2s; }

  .moments-body { height: 100%; overflow-y: auto; scrollbar-width: none; background: #fff; padding-top: 60px; } .moments-body::-webkit-scrollbar { display: none; }
  
  .moments-cover { position: relative; width: 100%; height: 160px; background: #ddd; margin-bottom: 35px; margin-top: -60px; }

  .moments-feed { padding: 0 12px 20px; }

  .modal-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,.65); z-index: 50; opacity: 0; pointer-events: none; transition: opacity .2s; border-radius: 28px; } .modal-overlay.show { opacity: 1; pointer-events: auto; }

  .moments-page { background: #f5f3f4; }
  .moments-header { background: rgba(248,247,248,.78); backdrop-filter: blur(18px); }
  .cover-bg { background: radial-gradient(circle at 74% 18%, rgba(255,255,255,.34), transparent 19%), linear-gradient(135deg, #7387c1 0%, #2d304e 48%, #8a5f82 100%) !important; }
  .hb-bubble { box-shadow: 0 8px 22px rgba(120,35,35,.22); }
  .offline-photo-card {
    width: 165px;
    min-height: 112px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    border-radius: 12px;
    color: #fff;
    background: radial-gradient(circle at 72% 24%, rgba(255,255,255,.38), transparent 18%), linear-gradient(145deg, #718ac3, #303653 55%, #9a6684);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.3);
  }
  .offline-photo-card small { margin-top: 4px; opacity: .72; }
  .offline-sticker { font-size: 46px; line-height: 1; filter: drop-shadow(0 7px 8px rgba(0,0,0,.18)); }
  .offline-typing { display: inline-flex; gap: 4px; align-items: center; min-width: 42px; }
  .offline-typing i { width: 5px; height: 5px; border-radius: 50%; background: currentColor; opacity: .4; animation: offline-dot 1s infinite ease-in-out; }
  .offline-typing i:nth-child(2) { animation-delay: .14s; }
  .offline-typing i:nth-child(3) { animation-delay: .28s; }
  @keyframes offline-dot { 0%, 60%, 100% { transform: translateY(0); opacity: .35; } 30% { transform: translateY(-4px); opacity: .9; } }
  @media (max-height: 610px) { .phone-container { min-height: 520px; } .portfolio-phone-wrapper { padding-block: 10px; } }
</style>

<script id="portfolio-offline-portfolio-script">
(() => {
  const boot = () => {
    const wrappers = document.querySelectorAll('.portfolio-phone-wrapper.initialized');
    const wrap = wrappers[wrappers.length - 1];
    if (!wrap || wrap.dataset.contentReady !== '1') { setTimeout(boot, 60); return; }
    if (wrap.dataset.offlineReady) return;
    wrap.dataset.offlineReady = '1';
    wrap.classList.add('offline-demo', 'no-anim');

    const $ = selector => wrap.querySelector(selector);
    const body = $('#dynamic-chat-body');
    const input = $('.chat-input');
    const title = $('.chat-header .title');
    const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const palette = {
      'User': ['#8ba4ff', '#7d5fff'], 'Mori': ['#8ba4ff', '#7d5fff'],
      '林弥': ['#67d7c4', '#317c91'], '顾屿': ['#98a8ff', '#5b5bd6'],
      '沈梨': ['#ff9fb5', '#b65f8e'], '许澈': ['#b9bec8', '#5c626f']
    };
    const emojiByName = {'撒娇':'🥺','芜湖':'🥳','哭':'🥲','期待':'✨','困惑':'🫠','严肃':'🧐','尖叫':'😱','警告':'⚠️','失望':'😔','亲亲':'😘','贴贴':'🫶','口水':'🤤'};

    const avatar = name => {
      const colors = palette[name] || ['#8993a4', '#4f596b'];
      const label = name === 'User' ? 'M' : String(name).slice(0, 1).toUpperCase();
      const svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="' + colors[0] + '"/><stop offset="1" stop-color="' + colors[1] + '"/></linearGradient></defs><rect width="96" height="96" rx="30" fill="url(#g)"/><circle cx="70" cy="24" r="18" fill="white" opacity=".16"/><text x="48" y="54" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="white">' + escapeHtml(label) + '</text></svg>';
      return 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(svg);
    };

    const refreshAvatars = () => {
      wrap.querySelectorAll('.msg-row').forEach(row => {
        const name = row.classList.contains('right') ? 'User' : (row.dataset.name || '许澈');
        const image = row.querySelector('.avatar');
        if (image) image.src = avatar(name);
      });
      const profile = $('#moments-cover-avatar');
      if (profile) profile.src = avatar('User');
    };



    input.removeAttribute('readonly');
    input.placeholder = '输入消息，按 Enter 发送';
    input.value = '';
    const sendButton = document.createElement('button');
    sendButton.type = 'button';
    sendButton.className = 'offline-send-btn';
    sendButton.textContent = '发送';
    $('.input-row').appendChild(sendButton);

    let blocked = wrap.dataset.blocked === '1';
    let conversationEpoch = 0;
    const pendingReplies = new Set();
    const cancelReplies = () => {
      conversationEpoch++;
      pendingReplies.forEach(timer => clearTimeout(timer));
      pendingReplies.clear();
      body.querySelectorAll('[data-typing="1"]').forEach(row => row.remove());
    };
    const blockBanner = document.createElement('div');
    blockBanner.className = 'block-banner';
    blockBanner.innerHTML = '<span>已开启拉黑拦截 · 无法收发消息</span><button type="button" data-unblock>解除</button>';
    body.before(blockBanner);
    const showBlockNotice = () => {
      blockBanner.classList.remove('attention');
      void blockBanner.offsetWidth;
      blockBanner.classList.add('attention');
    };
    const applyBlockState = () => {
      wrap.setBlockState(blocked);
      blockBanner.hidden = !blocked;
      input.disabled = blocked;
      sendButton.disabled = blocked;
      input.classList.toggle('blocked', blocked);
      input.placeholder = blocked ? '已拦截，请先解除拉黑' : '输入消息，按 Enter 发送';
      const button = $('#block-btn');
      button.textContent = blocked ? '解除拉黑拦截' : '拉黑拦截模式';
      button.classList.toggle('danger', !blocked);
      button.style.background = blocked ? '#321519' : '';
      button.style.color = blocked ? '#ffb5b5' : '';
      wrap.classList.toggle('conversation-blocked', blocked);
    };
    const toggleBlock = () => {
      blocked = !blocked;
      cancelReplies();
      input.value = '';
      applyBlockState();
      $('.settings-page').classList.remove('show');
      wrap.querySelectorAll('.drawer-menu').forEach(el => el.classList.remove('show'));
      $('.plus-btn').classList.remove('active');
      const note = document.createElement('div');
      note.className = 'system-msg';
      note.textContent = blocked ? '已开启拉黑拦截，消息收发已暂停' : '已解除拉黑，可以继续聊天';
      body.appendChild(note);
      body.scrollTop = body.scrollHeight;
    };
    wrap.addEventListener('toggle-block', toggleBlock);
    wrap.addEventListener('local-action', event => {
      if (blocked) { showBlockNotice(); return; }
      const text = String(event.detail || '');
      if (text.startsWith('引用')) { input.value = text; input.focus(); }
      else if (/^(领取|退回)了/.test(text)) {
        const note = document.createElement('div'); note.className = 'system-msg';
        note.textContent = text.replace(/：$/, ''); body.appendChild(note);
      }
    });

    const makeArt = (scene = 0) => {
      const sky = ['#9aabba','#b7aba0','#7c98a5'][scene % 3];
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300"><rect width="360" height="300" fill="${sky}"/><circle cx="270" cy="65" r="27" fill="#f7e9d2"/><path d="M0 175Q80 140 180 181T360 166V300H0" fill="#4e6d7c"/><path d="M0 240Q110 190 215 247T360 220V300H0" fill="#bac0b7"/><path d="M0 204Q100 180 180 208T360 194" stroke="#e2e7df" fill="none" opacity=".6"/><path d="M85 170L94 80H106L115 170" fill="#dcdad4"/><path d="M90 80L100 65L110 80Z" fill="#384b55"/><rect x="96" y="91" width="8" height="12" fill="#f8e6ba"/></svg>`;
      return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
    };
    const moments = [
      {author:'沈梨', time:'12分钟前', text:'把今晚的月亮先替大家存下来。\n风很舒服，明天还想再来一次。', pics:[0,1,2], likes:['林弥','顾屿'], comments:[['林弥','等我们到！'],['顾屿','这张光好漂亮。']]},
      {author:'顾屿', time:'38分钟前', text:'出发前的最后一杯咖啡。\n下一站，北岸灯塔。', pics:[], likes:['沈梨'], comments:[['沈梨','路上慢点。']]},
      {author:'林弥', time:'1小时前', text:'计划可以临时改，见面不能。', pics:[2], likes:['顾屿'], comments:[]}
    ];
    const momentsPage = $('.moments-page');
    momentsPage.innerHTML = `<div class="wx-nav"><button type="button" data-moment-back aria-label="返回">‹</button><strong>朋友圈</strong><button type="button" data-moment-compose aria-label="发表动态"><svg class="svg-icon" viewBox="0 0 24 24"><path d="M3 7h4l2-3h6l2 3h4v13H3z"/><circle cx="12" cy="13" r="4"/></svg></button></div><div class="wx-scroll"><div class="wx-cover" id="moments-cover-bg" style="background-image:url('${makeArt(0)}')"><div class="wx-cover-shade"></div><div class="wx-profile"><span id="moments-cover-name" contenteditable="true">Mori</span><img id="moments-cover-avatar" alt="我的头像" src="${avatar('User')}"></div></div><div class="wx-signature">把日常，过成值得记录的瞬间。</div><div id="moments-feed-container"></div><div class="wx-end">朋友的近况，都在这里</div></div><form class="wx-composer" hidden><label class="wx-composer-label" for="wx-comment-input">评论</label><div><input id="wx-comment-input" maxlength="300" autocomplete="off" placeholder="评论…" required><button type="submit">发送</button><button type="button" data-comment-cancel aria-label="取消">×</button></div></form>`;
    let commentTarget = null;
    const myName = () => $('#moments-cover-name').textContent.trim() || 'Mori';
    const renderSocial = () => {
      $('#moments-feed-container').innerHTML = moments.map((m,i) => `<article class="wx-post" data-post="${i}"><img class="wx-avatar" src="${avatar(m.author)}" alt="${escapeHtml(m.author)}"><div class="wx-main"><div class="wx-name">${escapeHtml(m.author)}</div><div class="wx-copy">${escapeHtml(m.text)}</div>${m.pics.length ? `<div class="wx-pictures ${m.pics.length===1?'single':''}">${m.pics.map(p=>`<button type="button" data-moment-picture="${p}" aria-label="查看照片"><img src="${makeArt(p)}" alt="海边灯塔"></button>`).join('')}</div>` : ''}<div class="wx-details"><time>${escapeHtml(m.time)}</time><span class="wx-location">${m.pics.length?'北岸 · 海边':''}</span><button type="button" class="wx-more" data-social-menu aria-label="点赞和评论">••</button></div><div class="wx-actions" hidden><button type="button" data-social-like>♡ ${m.likes.includes(myName())?'取消':'赞'}</button><button type="button" data-social-comment>▢ 评论</button></div>${m.likes.length || m.comments.length ? `<div class="wx-reactions">${m.likes.length?`<div class="wx-likes">♡ ${m.likes.map(escapeHtml).join('，')}</div>`:''}${m.comments.map(([n,t])=>`<div class="wx-comment"><b>${escapeHtml(n)}：</b>${escapeHtml(t)}</div>`).join('')}</div>`:''}</div></article>`).join('');
    };
    renderSocial();
    const composer = $('.wx-composer');
    const commentInput = $('#wx-comment-input');
    const openComposer = index => {
      commentTarget = index;
      composer.hidden = false;
      $('.wx-composer-label').textContent = index === null ? '发表动态' : '评论 ' + moments[index].author;
      commentInput.placeholder = index === null ? '这一刻的想法…' : '评论…';
      commentInput.value = ''; commentInput.focus();
    };
    composer.addEventListener('submit', event => {
      event.preventDefault();
      const value = commentInput.value.trim(); if (!value) return;
      if (commentTarget === null) moments.unshift({author:myName(),time:'刚刚',text:value,pics:[],likes:[],comments:[]});
      else moments[commentTarget].comments.push([myName(),value]);
      renderSocial(); composer.hidden = true; commentInput.value = '';
      if (commentTarget === null) $('.wx-scroll').scrollTop = 0;
    });
    const article = document.createElement('section');
    article.className = 'news-reader'; article.hidden = true;
    article.setAttribute('role','dialog'); article.setAttribute('aria-label','城市观察文章');
    article.innerHTML = `<header><button type="button" data-news-close aria-label="返回">‹</button><span>城市观察</span></header><div class="news-article"><span class="news-category">生活观察</span><h1>凌晨四点，年轻人集体涌向海边！看完原因，网友：我也想去</h1><p class="news-byline">城市观察编辑部 · 生活栏目</p><div class="news-hero"></div><p>闹钟比上班还早，目的地却不是公司。一群朋友约好在天亮之前出发，只为一起看一次海上日出。</p><p>有人带咖啡，有人带相机，还有人只带着一句“我也去”。漫长的一周，终于在海风里慢了下来。</p><h2>让人心动的，是有人愿意一起出发</h2><p>灯塔、晨光和热饮都很好。更难得的是，随口说出的计划，真的有人放在心上。</p><p class="news-fiction">虚构生活短文 · 作品集示例</p></div>`;
    $('.phone-container').appendChild(article);

    const readIncoming = () => {
      if (document.hidden || $('.moments-page.show,.settings-page.show')) return;
      body.querySelectorAll('.msg-row.left .msg-meta span').forEach(el => el.textContent = '已读');
    };
    document.addEventListener('visibilitychange', readIncoming);

    wrap.addEventListener('click', event => {
      const t = event.target;
      const stop = () => { event.preventDefault(); event.stopImmediatePropagation(); };
      if (t.closest('#block-btn,[data-unblock]')) { stop(); toggleBlock(); return; }
      if (t.closest('#reset-default-btn')) {
        cancelReplies(); blocked = false;
        queueMicrotask(() => { input.value=''; applyBlockState(); renderSocial(); });
        return;
      }
      if (t.closest('.header-moments-btn')) { stop(); renderSocial(); momentsPage.classList.add('show'); return; }
      if (t.closest('[data-moment-back]')) { stop(); momentsPage.classList.remove('show'); composer.hidden=true; readIncoming(); return; }
      if (t.closest('.settings-page .back-btn')) { queueMicrotask(readIncoming); }
      if (t.closest('[data-moment-compose]')) { stop(); openComposer(null); return; }
      if (t.closest('[data-comment-cancel]')) { stop(); composer.hidden=true; return; }
      const post = t.closest('[data-post]');
      if (t.closest('[data-social-menu]')) {
        stop(); const menu = post.querySelector('.wx-actions'); const wasOpen=!menu.hidden;
        momentsPage.querySelectorAll('.wx-actions').forEach(m => m.hidden=true);
        menu.hidden=wasOpen; return;
      }
      if (t.closest('[data-social-like]')) {
        stop(); const m=moments[Number(post.dataset.post)];
        const index=m.likes.indexOf(myName()); if(index<0) m.likes.push(myName()); else m.likes.splice(index,1);
        renderSocial(); return;
      }
      if (t.closest('[data-social-comment]')) { stop(); openComposer(Number(post.dataset.post)); post.querySelector('.wx-actions').hidden=true; return; }
      const photo=t.closest('[data-moment-picture]');
      if (photo) { stop(); $('.pic-modal-icon').style.display='none'; $('#pic-modal-text').innerHTML='<img alt="海边灯塔" style="width:100%;border-radius:8px" src="'+makeArt(Number(photo.dataset.momentPicture))+'">'; $('#pic-modal-overlay').classList.add('show'); return; }
      if (t.closest('.news-card')) { stop(); article.hidden=false; return; }
      if (t.closest('[data-news-close]')) { stop(); article.hidden=true; return; }
      if (blocked && t.closest('.quick-btn,.action-btn,.emoji-item,.inner-voice-icon,.plus-btn,.send-trigger-btn,.luxury-video-bubble,#hb-btn-receive,#hb-btn-return,#req-btn-accept,#req-btn-reject')) {
        stop(); showBlockNotice(); return;
      }
    }, true);
    wrap.addEventListener('keydown', event => {
      if(event.key==='Escape') { article.hidden=true; composer.hidden=true; momentsPage.classList.remove('show'); readIncoming(); }
    });

    let replyIndex = 0;
    const replies = [
      ['林弥', '收到。海边见，迟到的人负责买热可可。'],
      ['顾屿', '我已经在路上了，风比想象中温柔。'],
      ['沈梨', '等一下，我再带一台拍立得。'],
      ['林弥', '这条已经存进今晚的群聊纪念册了。']
    ];

    const bubbleContent = (kind, payload, side) => {
      if (kind === 'voice') {
        return {cls: 'voice-bubble luxury-voice-card', attrs: '', html: '<div class="luxury-card-kicker">VOICE NOTE <span>0:04</span></div><div class="voice-ui"><div class="waveform"><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div></div><span class="luxury-voice-play">▶</span></div><div class="voice-text-container"><span class="msg-text">' + escapeHtml(payload) + '</span></div>'};
      }
      if (kind === 'link') {
        return {cls: 'link-bubble news-card', attrs: '', html: portfolioNewsHTML};
      }
      if (kind === 'hb') {
        return {cls: 'hb-bubble luxury-gift-money', attrs: 'data-amount="8.88"', html: '<div class="hb-top"><div class="hb-icon-wrapper flex-c">礼</div><div class="flex-col" style="flex:1;justify-content:center"><div class="hb-title">' + escapeHtml(payload) + '</div><div class="hb-subtitle status-text">' + (side === 'left' ? '轻触接收礼金' : '等待对方接收') + '</div></div></div><div class="hb-bottom">PRIVATE GIFT · ¥8.88</div>'};
      }
      if (kind === 'pic') {
        return {cls: 'sticker-bubble luxury-picture-bubble', attrs: '', html: '<div class="offline-photo-card" role="button" tabindex="0"><div class="luxury-photo-moon"></div><div class="luxury-photo-line"></div><strong>COAST / 21:24</strong><small>' + escapeHtml(payload) + '</small><span class="luxury-photo-open">查看大图</span></div>'};
      }
      if (kind === 'sticker') {
        return {cls: 'sticker-bubble luxury-sticker-bubble', attrs: '', html: '<div class="offline-sticker" aria-label="' + escapeHtml(payload) + '"><span>' + escapeHtml(payload) + '</span><small>REACTION</small></div>'};
      }
      if (kind === 'location') {
        return {cls: 'luxury-location-bubble', attrs: '', html: '<div class="luxury-card-kicker">LOCATION · 1.2 KM</div><div class="luxury-location-title">北岸灯塔</div><div class="luxury-location-address">' + escapeHtml(payload) + '</div><div class="luxury-map"><i></i><span>⌖</span><b>36.08° N</b></div><div class="luxury-card-action">轻触展开坐标</div>'};
      }
      if (kind === 'music') {
        return {cls: 'luxury-music-bubble', attrs: '', html: '<div class="luxury-record"><i></i></div><div class="luxury-music-copy"><div class="luxury-card-kicker">NOW PLAYING</div><strong>Night Drive</strong><small>' + escapeHtml(payload) + '</small><div class="luxury-equalizer"><i></i><i></i><i></i><i></i></div></div><button type="button" class="luxury-play-button" aria-label="播放或暂停">▶</button>'};
      }
      if (kind === 'video') {
        return {cls: 'luxury-video-bubble', attrs: '', html: '<div class="luxury-video-avatar">顾</div><div class="luxury-video-copy"><div class="luxury-card-kicker">VIDEO CALL</div><strong>顾屿的视频通话</strong><small class="luxury-video-state">正在呼叫 · 轻触查看</small></div><span class="luxury-video-ring">⌁</span>'};
      }
      if (kind === 'gift') {
        return {cls: 'luxury-gift-bubble', attrs: '', html: '<div class="luxury-gift-visual"><i></i><b></b></div><div class="luxury-gift-copy"><div class="luxury-card-kicker">GIFT DELIVERY</div><strong>月光银书签礼盒</strong><small class="luxury-gift-state">限定礼盒 · ' + escapeHtml(payload) + '</small></div><span class="luxury-gift-cta">待拆封</span>'};
      }
      if (kind === 'file') {
        return {cls: 'luxury-file-bubble', attrs: '', html: '<div class="luxury-file-preview"><span>PDF</span><i></i></div><div class="luxury-file-copy"><div class="luxury-card-kicker">DOCUMENT</div><strong>旅行清单.pdf</strong><small class="luxury-file-state">2.4 MB · PDF 文档</small><div class="luxury-file-progress"><i></i></div></div><button type="button" class="luxury-file-download" aria-label="保存文件">↓</button>'};
      }
      if (kind === 'typing') {
        return {cls: '', attrs: '', html: '<span class="offline-typing"><i></i><i></i><i></i></span>'};
      }
      return {cls: '', attrs: '', html: '<span class="msg-text">' + escapeHtml(payload) + '</span>'};
    };

    const appendMessage = (name, kind, payload, side) => {
      const direction = side || (name === 'User' ? 'right' : 'left');
      const content = bubbleContent(kind || 'text', payload, direction);
      const row = document.createElement('div');
      row.className = 'msg-row ' + direction;
      row.dataset.name = name;
      const displayName = direction === 'left' ? name : '';
      row.innerHTML = '<div class="avatar-col"><img src="' + avatar(name) + '" class="avatar avatar-round"></div><div class="msg-content"><div class="msg-name">' + escapeHtml(displayName) + '</div><div style="display:flex;flex-direction:' + (direction === 'left' ? 'row' : 'row-reverse') + '"><div class="msg-bubble ' + (direction === 'left' ? 'msg-left ' : 'msg-right ') + content.cls + '" ' + content.attrs + '>' + content.html + '</div></div><div class="msg-meta"><span>' + (kind === 'typing' ? '' : direction === 'right' || document.hidden || $('.moments-page.show,.settings-page.show') ? '未读' : '已读') + '</span></div></div>';
      body.appendChild(row);
      body.scrollTop = body.scrollHeight;
      return row;
    };

    const queueReply = hint => {
      if (blocked) return;
      const epoch = conversationEpoch;
      const picked = replies[replyIndex++ % replies.length];
      const typing = appendMessage(picked[0], 'typing', '', 'left');
      typing.dataset.typing = '1';
      const timer = setTimeout(() => {
        pendingReplies.delete(timer); typing.remove();
        if (blocked || epoch !== conversationEpoch) return;
        body.querySelectorAll('.msg-row.right .msg-meta span').forEach(el => el.textContent = '已读');
        appendMessage(picked[0], 'text', hint || picked[1], 'left');
      }, 900);
      pendingReplies.add(timer);
    };

    const sendText = () => {
      if (blocked) { showBlockNotice(); return; }
      const text = input.value.trim();
      if (!text) { input.focus(); return; }
      input.value = '';
      appendMessage('User', 'text', text, 'right');
      let hint = '';
      if (/你好|嗨|hello/i.test(text)) hint = '晚上好！这是离线预设回复，但每个按钮都可以真的互动。';
      else if (/海|出发|走/.test(text)) hint = '好，定位还是老地方。我把夜航歌单也带上。';
      else if (/作品|组件|demo/i.test(text)) hint = '这个版本不需要 API，断网打开也能完整演示。';
      queueReply(hint);
    };

    const addAction = action => {
      if (blocked) { showBlockNotice(); return; }
      if (action === 'picture') { appendMessage('User', 'pic', '刚刚拍下的黑白海岸', 'right'); queueReply('这张构图很适合作为今晚的封面。'); }
      else if (action === 'redpacket') { appendMessage('User', 'hb', '今晚见者有份', 'right'); queueReply('礼金收到，热可可基金正式成立。'); }
      else if (action === 'link') { appendMessage('User', 'link', '看完这篇，明早真的想出门了', 'right'); queueReply('标题有点夸张，不过看日出这件事我赞成。'); }
      else if (action === 'voice') { appendMessage('User', 'voice', '我快到了，你们先点单。', 'right'); queueReply('听到了，我们给你留靠窗的位置。'); }
      else if (action === 'location') { appendMessage('User', 'location', '滨海公路 27 号', 'right'); queueReply('坐标收到了，我离你还有一点二公里。'); }
      else if (action === 'music') { appendMessage('User', 'music', 'Mori · Night Sessions', 'right'); queueReply('已加入共同播放队列。'); }
      else if (action === 'video') { appendMessage('User', 'video', '夜航俱乐部', 'right'); queueReply('视频邀请已收到，点击卡片可以模拟接通。'); }
      else if (action === 'gift') { appendMessage('User', 'gift', '限定编号 008', 'right'); queueReply('礼物已签收，等见面再拆。'); }
      else if (action === 'file') { appendMessage('User', 'file', '旅行清单.pdf', 'right'); queueReply('文件已收到，路线没有问题。'); }
      else { appendMessage('User', 'text', action, 'right'); queueReply(); }
    };

    const conversations = {
      '林弥': [['林弥','text','你到哪了？海边风已经起来了。'],['User','text','还有两站。'],['林弥','pic','灯塔刚刚亮了，现场比照片更好看。']],
      '顾屿': [['顾屿','voice','我在便利店，要给你带什么？'],['User','text','热牛奶就好，谢谢。'],['顾屿','text','好。五分钟后门口见。']],
      '沈梨': [['沈梨','link','这篇新闻说的是不是我们？'],['User','text','封面很适合今晚。'],['沈梨','text','因为就是用今晚的天空配的色。']],
      '许澈': [['许澈','text','欢迎体验这套离线通讯组件。'],['User','text','不连接 API 也能玩吗？'],['许澈','text','可以。发送、表情、礼金、动态和会话切换都使用本地模拟。']]
    };

    const loadConversation = (key, label, isGroup) => {
      cancelReplies();
      body.innerHTML = '';
      title.textContent = label;
      wrap.classList.toggle('group-mode', Boolean(isGroup));
      const system = document.createElement('div');
      system.className = 'system-msg';
      system.textContent = isGroup ? '已切换到本地群聊演示' : '已切换到与 ' + label + ' 的本地会话';
      body.appendChild(system);
      const items = isGroup ? [
        ['林弥','text','周末提案：去海边看日出。'],
        ['顾屿','voice','赞成，我来开车。'],
        ['沈梨','link','日出时间与潮汐表'],
        ['User','text','那就四点半集合。']
      ] : (conversations[key] || conversations['许澈']);
      items.forEach(item => appendMessage(item[0], item[1], item[2]));
      refreshAvatars();
      body.querySelectorAll('.msg-meta span').forEach(el => el.textContent = '已读');
    };

    sendButton.addEventListener('click', sendText);
    input.addEventListener('keydown', event => {
      if (event.key === 'Enter' && !event.isComposing) { event.preventDefault(); sendText(); }
    });

    wrap.addEventListener('click', event => {
      const videoAction = event.target.closest('[data-video-action]');
      if (videoAction) {
        event.preventDefault(); event.stopImmediatePropagation();
        const modal = $('#portfolio-video-modal');
        if (!modal) return;
        const action = videoAction.dataset.videoAction;
        if (action === 'accept') {
          modal.classList.add('connected');
          const status = modal.querySelector('.portfolio-video-status');
          if (status) status.textContent = '通话中 · 00:08';
          videoAction.disabled = true;
          const label = videoAction.querySelector('small');
          if (label) label.textContent = '已接通';
        } else {
          modal.classList.remove('show', 'connected');
          modal.setAttribute('aria-hidden', 'true');
        }
        return;
      }
      const musicCard = event.target.closest('.luxury-music-bubble');
      if (musicCard) {
        event.preventDefault(); event.stopImmediatePropagation();
        musicCard.classList.toggle('playing');
        const button = musicCard.querySelector('.luxury-play-button');
        if (button) button.textContent = musicCard.classList.contains('playing') ? 'Ⅱ' : '▶';
        return;
      }

      const locationCard = event.target.closest('.luxury-location-bubble');
      if (locationCard) {
        event.preventDefault(); event.stopImmediatePropagation();
        locationCard.classList.toggle('expanded');
        const actionText = locationCard.querySelector('.luxury-card-action');
        if (actionText) actionText.textContent = locationCard.classList.contains('expanded') ? '36.0814° N · 120.3416° E' : '轻触展开坐标';
        return;
      }

      const videoCard = event.target.closest('.luxury-video-bubble');
      if (videoCard) {
        event.preventDefault(); event.stopImmediatePropagation();
        const modal = $('#portfolio-video-modal');
        if (modal) {
          modal.classList.add('show');
          modal.classList.remove('connected');
          modal.setAttribute('aria-hidden', 'false');
          const status = modal.querySelector('.portfolio-video-status');
          if (status) status.textContent = '视频通话邀请';
          const accept = modal.querySelector('[data-video-action="accept"]');
          if (accept) { accept.disabled = false; accept.querySelector('small').textContent = '接听'; }
        }
        return;
      }

      const giftCard = event.target.closest('.luxury-gift-bubble');
      if (giftCard) {
        event.preventDefault(); event.stopImmediatePropagation();
        giftCard.classList.toggle('opened');
        const stateText = giftCard.querySelector('.luxury-gift-state');
        if (stateText) stateText.textContent = giftCard.classList.contains('opened') ? '已拆封 · 月光银书签' : '限定礼盒 · 编号 008';
        const cta = giftCard.querySelector('.luxury-gift-cta');
        if (cta) cta.textContent = giftCard.classList.contains('opened') ? '已签收' : '待拆封';
        return;
      }

      const fileCard = event.target.closest('.luxury-file-bubble');
      if (fileCard) {
        event.preventDefault(); event.stopImmediatePropagation();
        fileCard.classList.add('saved');
        const stateText = fileCard.querySelector('.luxury-file-state');
        if (stateText) stateText.textContent = '已保存 · 2.4 MB';
        const download = fileCard.querySelector('.luxury-file-download');
        if (download) download.textContent = '✓';
        return;
      }



      const photoCard = event.target.closest('.offline-photo-card');
      if (photoCard) {
        event.preventDefault(); event.stopImmediatePropagation();
        const modalText = $('#pic-modal-text');
        const modalIcon = $('.pic-modal-icon');
        if (modalIcon) modalIcon.style.display = 'none';
        if (modalText) modalText.innerHTML = '<div class="luxury-photo-preview"><div class="luxury-photo-moon"></div><div class="luxury-photo-line"></div><strong>COAST / 21:24</strong><small>雾蓝色海岸与远处灯塔 · 离线示意图</small></div>';
        $('#pic-modal-overlay')?.classList.add('show');
        return;
      }

      const voiceIcon = event.target.closest('.inner-voice-icon');
      if (voiceIcon) {
        event.preventDefault(); event.stopImmediatePropagation();
        addAction('voice');
        return;
      }

      const momentsRefresh = event.target.closest('.moments-top-refresh-btn, .moments-refresh-btn');
      if (momentsRefresh) {
        event.preventDefault(); event.stopImmediatePropagation();
        momentsRefresh.classList.add('spin');
        wrap.querySelectorAll('.fc-time').forEach((item, index) => {
          if (index === 0) item.textContent = '刚刚刷新';
        });
        const feed = $('#moments-feed-container');
        if (feed) {
          const toast = document.createElement('div');
          toast.className = 'luxury-refresh-toast';
          toast.textContent = '本地动态已刷新';
          feed.prepend(toast);
          setTimeout(() => toast.remove(), 1400);
        }
        setTimeout(() => momentsRefresh.classList.remove('spin'), 700);
        return;
      }

      const inputHit = event.target.closest('.chat-input');
      if (inputHit) { event.stopImmediatePropagation(); input.focus(); return; }

      const quick = event.target.closest('.quick-btn');
      if (quick) {
        event.preventDefault(); event.stopImmediatePropagation();
        const command = quick.dataset.cmd || '';
        if (command.includes('图片')) addAction('picture');
        else if (command.includes('红包')) addAction('redpacket');
        else if (command.includes('链接')) addAction('link');
        else input.focus();
        return;
      }

      const action = event.target.closest('.action-btn');
      if (action) {
        event.preventDefault(); event.stopImmediatePropagation();
        const command = action.dataset.cmd || '';
        $('.plus-menu')?.classList.remove('show');
        $('.plus-btn')?.classList.remove('active');
        if (command.includes('图片')) addAction('picture');
        else if (command.includes('红包')) addAction('redpacket');
        else if (command.includes('链接')) addAction('link');
        else if (command.includes('视频')) addAction('video');
        else if (command.includes('位置')) addAction('location');
        else if (command.includes('听歌')) addAction('music');
        else if (command.includes('礼物')) addAction('gift');
        else if (command.includes('文件')) addAction('file');
        return;
      }

      const sticker = event.target.closest('.emoji-item');
      if (sticker) {
        event.preventDefault(); event.stopImmediatePropagation();
        if (blocked) { showBlockNotice(); return; }
        const emoji = emojiByName[sticker.title] || '✨';
        $('#emoji-drawer')?.classList.remove('show');
        appendMessage('User', 'sticker', emoji, 'right');
        queueReply('收到你的表情了。今晚心情也差不多是这样。');
        return;
      }

      const switchItem = event.target.closest('.switch-item');
      if (switchItem) {
        event.preventDefault(); event.stopImmediatePropagation();
        const isGroup = switchItem.dataset.target === 'group';
        const key = switchItem.dataset.target;
        const label = isGroup ? (switchItem.dataset.title || '群聊') : (switchItem.querySelector('span')?.textContent || key);
        $('#switch-drawer')?.classList.remove('show');
        loadConversation(key, label, isGroup);
      }
    }, true);

    applyBlockState();
    title.textContent = '夜航俱乐部';
    wrap.classList.add('group-mode');
    refreshAvatars();
    if (!body.querySelector('.luxury-music-bubble')) {
      appendMessage('顾屿', 'music', 'Mori · Night Sessions', 'left');
      appendMessage('沈梨', 'location', '滨海公路 27 号', 'left');
    }
    body.querySelectorAll('.msg-meta span').forEach(el => el.textContent = '已读');
    body.scrollTop = 0;
  };
  setTimeout(boot, 240);
})();
</script>

.wx-pictures { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:4px; margin-top:10px; }
.wx-pictures button { display:block; border:0; padding:0; background:#eee; aspect-ratio:1; cursor:pointer; }
.wx-pictures img { width:100%; height:100%; object-fit:cover; display:block; }
.wx-pictures.single { width:79%; grid-template-columns:1fr; }
.wx-pictures.single button { aspect-ratio:1.3; }
.wx-details { display:flex; align-items:center; gap:7px; margin:11px 0 8px; color:#999; font-size:10px; }
.wx-location { color:#8a9ab6; flex:1; }
.wx-more { background:#f2f2f2; color:#576b95; border:0; border-radius:3px; font-size:15px; letter-spacing:1px; line-height:1; padding:0 6px 4px; cursor:pointer; }
.wx-actions { position:absolute; z-index:2; right:0; margin-top:-41px; display:flex; align-items:center; padding:3px; background:#4c4c4c; border-radius:5px; box-shadow:0 3px 10px #0002; }
.wx-actions button { color:#fff; background:transparent; border:0; padding:9px 15px; cursor:pointer; font-size:12px; }
.wx-actions button+button { border-left:1px solid #666; }
.wx-reactions { position:relative; margin-top:7px; padding:6px 8px; background:#f3f3f5; color:#333; font-size:11px; line-height:1.6; border-radius:2px; overflow-wrap:anywhere; }
.wx-reactions::before { content:''; position:absolute; top:-5px; left:10px; border-left:5px solid transparent; border-right:5px solid transparent; border-bottom:5px solid #f3f3f5; }
.wx-likes { color:#576b95; padding:0 0 3px; }
.wx-likes+.wx-comment { padding-top:4px; border-top:1px solid #e8e8ea; }
.wx-comment b { color:#576b95; font-weight:500; }
.wx-end { color:#c4c4c4; font-size:10px; text-align:center; padding:24px 0 30px; }
.wx-composer { flex-shrink:0; padding:8px 10px 12px; border-top:1px solid #ddd; background:#f6f6f6; }
.wx-composer-label { display:block; font-size:10px; color:#777; margin-bottom:5px; }
.wx-composer>div { display:flex; gap:7px; }
.wx-composer input { min-width:0; flex:1; background:white; border:1px solid #e5e5e5; border-radius:4px; padding:8px; color:#222; font-size:13px; outline:none; }
.wx-composer button { border:0; border-radius:4px; background:#07c160; color:#fff; padding:7px 10px; cursor:pointer; }
.wx-composer [data-comment-cancel] { background:transparent; color:#888; font-size:20px; padding:0 3px; }

</style>
</div>
