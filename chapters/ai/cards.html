<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">

    <style>
        700&family=Noto+Serif+JP:wght@300;500;700&display=swap');

        :root {
          --bg-color: #0a0a0a;
          --text-color: #e0e0e0;
          --accent-color: #ffffff;
          --dim-color: #666;
          --border-color: #333;
          --ren-blue: #1e3a8a; /* 桐生莲应援色 */
        }

        body {
          margin: 0;
          padding: 0;
          background-color: #000;
          font-family: 'Noto Serif JP', 'Times New Roman', serif;
          display: flex;
          justify-content: center;
          align-items: center;
          height: 100vh;
          overflow: hidden;
          color: var(--text-color);
          user-select: none;
        }

        #game-container {
          width: 100%;
          max-width: 450px;
          height: 600px;
          background: linear-gradient(180deg, #0f0f0f 0%, #050505 100%);
          position: relative;
          display: flex;
          flex-direction: column;
          border: 1px solid var(--border-color);
          box-shadow: 0 0 30px rgba(30, 58, 138, 0.1);
          overflow: hidden;
        }

        /* Ren's Area */
        #ren-area {
          flex: 1.2;
          display: flex;
          flex-direction: column;
          align-items: center;
          padding-top: 30px;
          position: relative;
          z-index: 2;
        }

        #ren-avatar {
          width: 80px;
          height: 80px;
          border-radius: 50%;
          background-image: url('https://pic1.imgdb.cn/item/693138c21f1698c4ff0a864a.jpg');
          background-size: cover;
          background-position: center top;
          border: 2px solid var(--dim-color);
          margin-bottom: 15px;
          box-shadow: 0 4px 15px rgba(0,0,0,0.5);
          transition: all 0.5s ease;
        }
        
        #ren-avatar.speaking {
          border-color: var(--ren-blue);
          box-shadow: 0 0 15px var(--ren-blue);
          transform: scale(1.05);
        }

        .bubble {
          background: rgba(255, 255, 255, 0.95);
          color: #1a1a1a;
          padding: 12px 16px;
          border-radius: 8px;
          font-size: 13px;
          max-width: 85%;
          text-align: center;
          position: relative;
          opacity: 0;
          transform: translateY(10px);
          transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
          margin-bottom: 20px;
          box-shadow: 0 4px 20px rgba(0,0,0,0.6);
          line-height: 1.6;
          font-weight: 500;
        }

        .bubble::after {
          content: '';
          position: absolute;
          bottom: -8px;
          left: 50%;
          transform: translateX(-50%);
          border-width: 8px 8px 0;
          border-style: solid;
          border-color: rgba(255, 255, 255, 0.95) transparent transparent transparent;
        }

        .bubble.visible {
          opacity: 1;
          transform: translateY(0);
        }

        /* Card Styles */
        .hand-area {
          display: flex;
          justify-content: center;
          gap: -10px; /* Overlap cards */
          padding: 10px;
          min-height: 90px;
          perspective: 1000px;
          width: 100%;
        }

        .card {
          width: 50px;
          height: 75px;
          background-color: #fff;
          border-radius: 6px;
          display: flex;
          justify-content: center;
          align-items: center;
          font-family: 'Cinzel', serif;
          font-weight: bold;
          font-size: 18px;
          color: #000;
          cursor: pointer;
          box-shadow: -2px 2px 8px rgba(0,0,0,0.4);
          transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), margin-top 0.3s;
          position: relative;
          border: 1px solid #ccc;
          margin: 0 2px;
        }

        .card.ren-card {
          background: repeating-linear-gradient(
          135deg,
          #111,
          #111 10px,
          #1a1a1a 10px,
          #1a1a1a 20px
          );
          color: transparent;
          border: 1px solid #333;
        }
        
        .card.ren-card::before {
          content: 'R';
          color: rgba(255,255,255,0.1);
          font-size: 24px;
          position: absolute;
        }
        
        .card.ren-card:hover {
          transform: translateY(-5px);
        }
        
        .card.ren-card.selected {
          transform: translateY(-20px) scale(1.1);
          border-color: var(--ren-blue);
          box-shadow: 0 0 15px rgba(30, 58, 138, 0.6);
          z-index: 10;
        }

        .card.joker {
          color: #8b0000;
          font-size: 14px;
        }

        /* Interaction Bar */
        #interaction-area {
          height: 70px;
          display: flex;
          justify-content: center;
          align-items: center;
          border-top: 1px solid rgba(255,255,255,0.1);
          border-bottom: 1px solid rgba(255,255,255,0.1);
          background: rgba(0,0,0,0.3);
          backdrop-filter: blur(5px);
        }

        .btn {
          background: transparent;
          border: 1px solid var(--dim-color);
          color: #ccc;
          padding: 8px 24px;
          margin: 0 12px;
          font-family: 'Noto Serif JP', serif;
          font-size: 12px;
          cursor: pointer;
          transition: all 0.3s;
          text-transform: uppercase;
          letter-spacing: 2px;
          border-radius: 2px;
        }

        .btn:hover:not(:disabled) {
          border-color: #fff;
          color: #fff;
          background: rgba(255,255,255,0.1);
          box-shadow: 0 0 10px rgba(255,255,255,0.2);
        }
        
        .btn:disabled {
          opacity: 0.3;
          cursor: not-allowed;
          border-color: #333;
        }

        /* User Area */
        #user-area {
          flex: 1;
          display: flex;
          flex-direction: column;
          justify-content: flex-end;
          padding-bottom: 30px;
          background: linear-gradient(to top, rgba(20,20,20,0.8), transparent);
        }
        
        /* Overlays */
        #user-dialogue-overlay {
          position: absolute;
          bottom: 0;
          left: 0;
          width: 100%;
          height: 200px;
          background: rgba(0,0,0,0.95);
          display: flex;
          flex-direction: column;
          justify-content: center;
          align-items: center;
          z-index: 20;

          transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
          border-top: 1px solid var(--ren-blue);
        }
        
        #user-dialogue-overlay.active {
          transform: translateY(0);
        }

        .choice-btn {
          width: 85%;
          padding: 12px;
          margin: 6px 0;
          background: rgba(255,255,255,0.05);
          border: 1px solid var(--dim-color);
          color: #eee;
          text-align: center;
          font-size: 13px;
          cursor: pointer;
          transition: all 0.2s;
        }
        
        .choice-btn:hover {
          background: #fff;
          color: #000;
          transform: scale(1.02);
        }

        .status-text {
          font-size: 11px;
          color: var(--dim-color);
          text-align: center;
          margin-top: 10px;
          letter-spacing: 1px;
          text-transform: uppercase;
        }
        
        /* Result Modal */
        #result-modal {
          position: absolute;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          background: rgba(0,0,0,0.95);
          display: flex;
          flex-direction: column;

          align-items: center;
          z-index: 50;
          opacity: 0;

        }
        
        #result-modal.active {
          opacity: 1;

        }
        
        #result-title {
          font-size: 24px;

          color: var(--ren-blue);

          font-size: 16px;
          margin-bottom: 30px;
          text-align: center;
          line-height: 1.8;
          padding: 0 40px;
          color: #ddd;
        }
    </style>
</head>

    // --- GAME LOGIC ---

    const SUITS = ['♠', '♥', '♣', '♦'];
    const RANKS = ['A', 'J', 'Q', 'K', '10']; // Short deck for quicker gameplay
    let deck = [];
    let renHand = [];
    let userHand = [];
    let turn = 'user'; 
    let selectedRenCardIndex = -1;
    let gameActive = true;

    // Helper: Random Array Picker
    function pickRandom(arr) {
        return arr[Math.floor(Math.random() * arr.length)];
    }

    // Initialization
    function initGame() {
        deck = createDeck();
        shuffle(deck);
        deal();
        removePairs(renHand);
        removePairs(userHand);
        
        turn = 'user';
        gameActive = true;
        selectedRenCardIndex = -1;
        
        // UI Reset
        document.getElementById('result-modal').classList.remove('active');
        document.getElementById('btn-affirm').disabled = true;
        document.getElementById('btn-check').disabled = false;
        document.getElementById('ren-avatar').classList.remove('speaking');
        
        // Initial Dialogue
        setBubble(pickRandom(DB.START));
        updateDisplay();
        
        // Check immediate win (rare but possible)
        checkWinCondition();
    }

    function createDeck() {
        let d = [];
        // Create pairs
        for(let r of RANKS) {
          d.push({suit: '♠', rank: r, isJoker: false});
          d.push({suit: '♥', rank: r, isJoker: false});
          d.push({suit: '♣', rank: r, isJoker: false});
          d.push({suit: '♦', rank: r, isJoker: false});
        }
        // Add Joker
        d.push({suit: '', rank: 'JOKER', isJoker: true}); 
        return d;
    }

    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [array[i], array[j]] = [array[j], array[i]];
        }
    }

    function deal() {
        renHand = [];
        userHand = [];
        for(let i=0; i<deck.length; i++) {
          if(i % 2 === 0) userHand.push(deck[i]);
          else renHand.push(deck[i]);
        }
    }

    function removePairs(hand) {
        const counts = {};
        hand.forEach(c => {
          if(c.isJoker) return;
          counts[c.rank] = (counts[c.rank] || 0) + 1;
        });
        
        for (let rank in counts) {
          while (counts[rank] >= 2) {
          const idx1 = hand.findIndex(c => c.rank === rank && !c.isJoker);
          hand.splice(idx1, 1);
          const idx2 = hand.findIndex(c => c.rank === rank && !c.isJoker);
          hand.splice(idx2, 1);
          counts[rank] -= 2;
          }
        }
    }

    // UI Updates
    function updateDisplay() {
        const renContainer = document.getElementById('ren-hand');
        const userContainer = document.getElementById('user-hand');
        
        // Ren Hand
        renContainer.innerHTML = '';
        renHand.forEach((card, index) => {
          const cardDiv = document.createElement('div');
          cardDiv.className = `card ren-card ${index === selectedRenCardIndex ? 'selected' : ''}`;
          cardDiv.onclick = () => onRenCardClick(index);
          renContainer.appendChild(cardDiv);
        });

        // User Hand
        userContainer.innerHTML = '';
        userHand.forEach(card => {
          const cardDiv = document.createElement('div');
          cardDiv.className = `card ${card.isJoker ? 'joker' : ''}`;
          cardDiv.innerText = card.isJoker ? 'JOKER' : card.rank;
          if(!card.isJoker) {
          if(card.suit === '♥' || card.suit === '♦') cardDiv.style.color = '#8b0000';
          }
          userContainer.appendChild(cardDiv);
        });

        const status = document.getElementById('game-status');
        if(turn === 'user') {
          status.innerText = "你的回合：点击桐生莲的牌进行抽取";
          status.style.color = "#fff";
        } else {
          status.innerText = "对方回合：桐生莲正在观察你...";
          status.style.color = "#888";

    }

    function setBubble(text) {
        const b = document.getElementById('ren-bubble');
        const avatar = document.getElementById('ren-avatar');
        
        b.classList.remove('visible');
        
        setTimeout(() => {
          b.innerText = text;
          b.classList.add('visible');
          avatar.classList.add('speaking');
          
          // Remove speaking animation after a while
          setTimeout(() => {
          avatar.classList.remove('speaking');
          }, 2000);
        }, 200); // Small delay for fade effect
    }

    function triggerIdleDialogue() {
        if(!gameActive) return;
        setBubble(pickRandom(DB.IDLE));
    }

    // --- USER ACTION PHASE ---

    function onRenCardClick(index) {
        if(turn !== 'user' || !gameActive) return;
        
        selectedRenCardIndex = index;
        updateDisplay();
        
        setBubble(pickRandom(DB.TOUCH));
        document.getElementById('btn-affirm').disabled = false;
    }

    function confirmRenSelection() {
        if(selectedRenCardIndex === -1) return;
        
        const card = renHand.splice(selectedRenCardIndex, 1)[0];
        userHand.push(card);
        removePairs(userHand);
        
        // Dialogue based on card result
        if (card.isJoker) {
          setBubble(pickRandom(DB.USER_TOOK_JOKER));
        } else {
          setBubble(pickRandom(DB.USER_TOOK_SAFE));
        }
        
        selectedRenCardIndex = -1;
        document.getElementById('btn-affirm').disabled = true;
        document.getElementById('btn-check').disabled = true;
        updateDisplay();
        
        if(checkWinCondition()) return;

        // Switch to Ren
        turn = 'ren';
        setTimeout(startRenTurn, 1500);
    }

    // --- REN ACTION PHASE ---

    function startRenTurn() {
        if(!gameActive) return;
        updateDisplay();
        
        // 1. Thinking phase
        setBubble(pickRandom(DB.REN_THINK));
        
        // 2. Present options to user
        setTimeout(() => {
          document.getElementById('user-dialogue-overlay').classList.add('active');
        }, 2000);
    }

    function userTalk(actionType) {
        // User makes a choice/reaction
        document.getElementById('user-dialogue-overlay').classList.remove('active');
        
        // Delay to simulate reaction
        setTimeout(() => {
          renReactAndDraw(actionType);
        }, 800);
    }

    function renReactAndDraw(actionType) {
        const jokerIdx = userHand.findIndex(c => c.isJoker);
        let pickIndex = -1;
        
        // AI LOGIC
        // Ren is smart (NPD/Observant). He usually avoids traps.
        // But sometimes he plays along or makes mistakes for drama.
        
        const safeIndices = userHand.map((c, i) => i).filter(i => i !== jokerIdx);
        let dialogueType = 'NEUTRAL'; // NEUTRAL, READ, TRUST
        
        if (jokerIdx !== -1) {
          // Player has Joker
          
          if (actionType === 'mislead') {
          // User tries to act like Joker is safe or vice versa
          // Ren sees through it 70% of the time
          if (Math.random() > 0.3) {
          pickIndex = safeIndices[Math.floor(Math.random() * safeIndices.length)];
          dialogueType = 'READ';
          } else {
          pickIndex = jokerIdx; // He fell for it (or played along)
          dialogueType = 'TRUST';
          }
          } else if (actionType === 'help') {
          // User tries to help him
          // Ren trusts 60% of time
          if (Math.random() > 0.4) {
          pickIndex = safeIndices[Math.floor(Math.random() * safeIndices.length)];
          dialogueType = 'TRUST';
          } else {
          pickIndex = jokerIdx; // Suspicious, so he picked the wrong one
          dialogueType = 'READ'; 
          }
          } else {
          // Silent
          pickIndex = (Math.random() > 0.5 && safeIndices.length > 0) ? 
          safeIndices[Math.floor(Math.random() * safeIndices.length)] : 
          Math.floor(Math.random() * userHand.length);
          dialogueType = 'NEUTRAL';
          }
        } else {
          // Player has no Joker (Safe draw)
          pickIndex = Math.floor(Math.random() * userHand.length);
          dialogueType = 'NEUTRAL';
        }
        
        // Speak BEFORE drawing (Reaction to user's behavior)
        if (dialogueType === 'READ') {
          setBubble(pickRandom(DB.REN_READ_PLAYER));
        } else if (dialogueType === 'TRUST') {
          setBubble(pickRandom(DB.REN_TRUST));
        }
        // If neutral, he might say nothing or generic thinking line (already said)

        // Execute Draw after short delay
        setTimeout(() => {
          const card = userHand.splice(pickIndex, 1)[0];
          renHand.push(card);
          
          // Speak AFTER drawing (Result reaction)
          setTimeout(() => {
          if(card.isJoker) {
          setBubble(pickRandom(DB.REN_GOT_JOKER));
          } else {
          // Check for pairs
          const count = renHand.filter(c => c.rank === card.rank).length;
          if(count >= 2) {
          setBubble(pickRandom(DB.REN_GOT_SAFE));
          }
          }
          
          removePairs(renHand);
          turn = 'user';
          document.getElementById('btn-check').disabled = false;
          updateDisplay();
          checkWinCondition();
          }, 1000);
          
        }, 1500);
    }

    // --- WIN/LOSE ---

    function checkWinCondition() {
        if(userHand.length === 0) {
          endGame('user');
          return true;
        }
        if(renHand.length === 0) {
          endGame('ren');
          return true;
        }
        return false;
    }

    function endGame(winner) {
        gameActive = false;
        const modal = document.getElementById('result-modal');
        const textDiv = document.getElementById('result-text');
        const titleDiv = document.getElementById('result-title');
        
        setTimeout(() => {
          modal.classList.add('active');
          if(winner === 'user') {
          // User Wins = Ren Loses
          titleDiv.innerText = "YOU WIN";
          titleDiv.style.color = "#fff";
          textDiv.innerText = pickRandom(DB.GAME_OVER_REN_LOSE);
          setBubble("......输了啊。");
          } else {
          // Ren Wins = User Loses
          titleDiv.innerText = "REN WINS";
          titleDiv.style.color = "#8b0000"; // Blood red
          textDiv.innerText = pickRandom(DB.GAME_OVER_REN_WIN);
          setBubble("意料之中。");
          }
        }, 1500);
    }

    // Start
    initGame();
</script>
